<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>LevA 준비</title>
<style>
  :root { --grad: linear-gradient(90deg,#7c6cff,#a855f7); }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; background: #0e0f13; color: #f3f5f9;
    font-family: "Pretendard","Segoe UI","맑은 고딕",sans-serif; font-size: 13px;
    display: flex; flex-direction: column; justify-content: center; padding: 24px; }
  .brand { display: flex; align-items: center; gap: 11px; margin-bottom: 18px; }
  .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--grad);
    display: flex; align-items: center; justify-content: center; }
  .logo svg { width: 18px; height: 18px; }
  .brand b { font-size: 14.5px; } .brand span { display: block; font-size: 11px; color: #6b7383; }
  .title { font-size: 13.5px; font-weight: 600; margin-bottom: 4px; }
  .sub { font-size: 11.5px; color: #a2abbb; min-height: 15px; margin-bottom: 12px; word-break: break-all; }
  .bar { height: 12px; background: #14161a; border: 1px solid rgba(255,255,255,.08); border-radius: 7px; overflow: hidden; }
  .fill { height: 100%; width: 0%; border-radius: 7px; background: var(--grad); transition: width .25s ease; }
  .fill.indet { width: 34% !important; animation: indet 1.1s infinite ease-in-out; }
  @keyframes indet { 0% { margin-left: -34%; } 100% { margin-left: 100%; } }
  .meta { display: flex; justify-content: space-between; font-size: 11px; color: #b9c1cd; margin-top: 8px; }
  .meta .pct { color: #b8adff; font-weight: 700; }
  .err { color: #ff7a7a; }
  .btn { margin-top: 16px; align-self: flex-start; background: var(--grad); color: #fff; border: none;
    border-radius: 9px; padding: 9px 16px; font-size: 12.5px; font-weight: 600; cursor: pointer; display: none; }
</style>
</head>
<body>
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 4v6c0 4-3 6.5-7 8-4-1.5-7-4-7-8V7z"/></svg></div>
    <div><b>LevA 준비 중</b><span>온디바이스 AI 엔진(llama.cpp) 설치</span></div>
  </div>
  <div class="title" id="title">llama.cpp 준비 중…</div>
  <div class="sub" id="sub">GPU를 확인하고 있습니다.</div>
  <div class="bar"><div class="fill indet" id="fill"></div></div>
  <div class="meta"><span id="pct">…</span><span id="speed">–</span><span id="size">–</span></div>
  <button id="retry" class="btn">다시 시도</button>

  <script>
    const $ = (id) => document.getElementById(id);
    function fmt(b) { if (!b || b < 1) return "0 B"; const u = ["B","KB","MB","GB"]; const i = Math.min(u.length-1, Math.floor(Math.log(b)/Math.log(1024))); return (b/Math.pow(1024,i)).toFixed(i?1:0)+" "+u[i]; }

    window.leva.onLlamaSetupProgress((p) => {
      if (!p) return;
      $("retry").style.display = "none";
      const be = p.backend ? " (" + p.backend.toUpperCase() + ")" : "";
      if (p.phase === "info") {
        $("title").textContent = "llama.cpp 준비 중" + be;
        $("sub").textContent = p.message || "";
        $("fill").classList.add("indet"); $("pct").textContent = "…";
      } else if (p.phase === "download") {
        $("title").textContent = "다운로드 중" + be + (p.count > 1 ? "  (" + p.index + "/" + p.count + ")" : "");
        $("sub").textContent = "GitHub 릴리스에서 엔진을 받는 중입니다.";
        if (p.total) {
          const pct = Math.min(100, p.percent || 0);
          $("fill").classList.remove("indet"); $("fill").style.width = pct.toFixed(1) + "%";
          $("pct").textContent = pct.toFixed(1) + "%";
          $("size").textContent = fmt(p.received) + " / " + fmt(p.total);
        } else {
          $("fill").classList.add("indet"); $("pct").textContent = "…"; $("size").textContent = fmt(p.received);
        }
        $("speed").textContent = p.speed ? fmt(p.speed) + "/s" : "–";
      } else if (p.phase === "extract") {
        $("title").textContent = "압축 해제 중" + be;
        $("sub").textContent = "설치 폴더에 엔진을 푸는 중입니다.";
        $("fill").classList.add("indet"); $("pct").textContent = "…"; $("speed").textContent = "–"; $("size").textContent = "–";
      } else if (p.phase === "done") {
        $("title").textContent = "준비 완료" + be + " ✓";
        $("sub").textContent = "곧 시작합니다.";
        $("fill").classList.remove("indet"); $("fill").style.width = "100%"; $("pct").textContent = "100%";
      } else if (p.phase === "error") {
        $("title").textContent = "설치 실패";
        $("sub").className = "sub err"; $("sub").textContent = p.error || "알 수 없는 오류";
        $("fill").classList.remove("indet"); $("retry").style.display = "inline-block";
      }
    });

    $("retry").addEventListener("click", async () => {
      $("sub").className = "sub"; $("sub").textContent = "다시 시도합니다…"; $("retry").style.display = "none";
      $("fill").classList.add("indet"); $("pct").textContent = "…";
      try { await window.leva.retryLlamaSetup(); } catch (e) {}
    });
  </script>
</body>
</html>
