<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>LevA 뷰어</title>
<link rel="stylesheet" href="./node_modules/pdfjs-dist/web/pdf_viewer.css" />
<style>
  :root {
    --bg: #0e0f13; --panel: #16171d; --field: #101116;
    --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.14);
    --text: #f3f5f9; --text-2: #a2abbb; --text-3: #6b7383;
    --accent: #7c6cff; --grad: linear-gradient(135deg,#7c6cff,#a855f7);
    --font: "Pretendard","Inter",-apple-system,"Segoe UI","맑은 고딕",sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text);
    height: 100vh; overflow: hidden; display: flex; flex-direction: column; font-size: 13px; -webkit-font-smoothing: antialiased; }

  header { flex: none; display: flex; align-items: center; gap: 12px; padding: 12px 150px 12px 18px; border-bottom: 1px solid var(--border);
    -webkit-app-region: drag; } /* 커스텀 타이틀바 — 우측은 창 버튼(overlay) 영역 */
  header .btn { -webkit-app-region: no-drag; }
  mark.hl { background: #45D6B8; color: #04231C; border-radius: 3px; padding: 0 2px; }
  .ficon { width: 32px; height: 32px; border-radius: 9px; flex: none; background: var(--grad); display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .fmeta { min-width: 0; flex: 1; }
  .fmeta b { font-size: 14px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fmeta span { font-size: 11px; color: var(--text-3); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn { background: #242730; color: var(--text); border: 1px solid var(--border-strong); border-radius: 9px; padding: 8px 13px; cursor: pointer; font-size: 12px; font-family: var(--font); flex: none; }
  .btn:hover { background: #2c303a; }
  .btn.primary { background: var(--grad); border: none; color: #fff; }

  .content { flex: 1; overflow: auto; background: #0b0c0f; position: relative; }
  .content iframe { width: 100%; height: 100%; border: none; background: #fff; }
  .content img { display: block; max-width: 100%; margin: 20px auto; }
  pre { margin: 0; padding: 22px 26px; white-space: pre-wrap; word-break: break-word;
    font-family: "Cascadia Code","Consolas",ui-monospace,monospace; font-size: 13px; line-height: 1.6; color: #e6ebf3; }
  .xls { border-collapse: collapse; font-size: 12.5px; margin: 6px 16px 20px; }
  .xls td, .xls th { border: 1px solid #2a2f38; padding: 6px 11px; color: #dfe4ec; white-space: nowrap; max-width: 360px; overflow: hidden; text-overflow: ellipsis; }
  .xls th { background: #1a1c23; font-weight: 600; position: sticky; top: 0; }
  .xls-name { padding: 14px 16px 6px; font-weight: 600; color: #b8adff; font-size: 13px; }
  .xls-note { padding: 0 16px 14px; font-size: 11px; color: #6b7383; }
  .docx { padding: 26px 30px; max-width: 820px; margin: 0 auto; color: #e6ebf3; font-size: 14px; line-height: 1.75; }
  .docx h1 { font-size: 21px; font-weight: 600; margin: 20px 0 9px; color: #fff; }
  .docx h2 { font-size: 16.5px; font-weight: 600; margin: 17px 0 7px; color: #eef1f6; }
  .docx p { margin: 7px 0; white-space: pre-wrap; }
  .docx li { margin: 5px 0 5px 24px; list-style: disc; white-space: pre-wrap; }
  .msg { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 14px; color: var(--text-3); }
  .msg .big { font-size: 40px; }
  .msg p { margin: 0; font-size: 13.5px; }
</style>
</head>
<body>
  <header>
    <div class="ficon" id="ficon">📄</div>
    <div class="fmeta"><b id="fname">불러오는 중…</b><span id="fpath"></span></div>
    <button id="external" class="btn">외부 앱으로 열기</button>
    <button id="close" class="btn">닫기</button>
  </header>
  <div class="content" id="content"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const IMAGE = [".png", ".jpg", ".jpeg", ".gif", ".webp", ".bmp", ".tif", ".tiff"];
    const HTML = [".html", ".htm"];
    const TEXT = [".txt", ".md", ".log", ".csv", ".json", ".xml", ".rtf",
      ".py", ".js", ".ts", ".jsx", ".tsx", ".vue", ".c", ".cpp", ".cc", ".cxx", ".h", ".hpp",
      ".cs", ".java", ".go", ".rs", ".rb", ".php", ".swift", ".kt", ".scala",
      ".sh", ".bat", ".ps1", ".sql", ".yaml", ".yml", ".toml", ".ini", ".lua", ".pl", ".r"];

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // file:// URL만 허용하고 DOM 프로퍼티로 주입(HTML 문자열 조립 금지 — XSS 방지)
    function safeFileEmbed(tag, info) {
      const u = String(info.fileUrl || "");
      if (!u.startsWith("file:")) {
        const d = document.createElement("div"); d.className = "msg";
        d.textContent = "허용되지 않는 파일 경로입니다.";
        return d;
      }
      const el = document.createElement(tag);
      el.src = u;
      if (tag === "img") el.alt = info.name || "";
      return el;
    }

    // 근거 발췌(snippet)를 본문에서 찾아 하이라이트하고 그 위치로 스크롤.
    // 1차: 원문 그대로(앞부분을 점점 줄여 가며). 2차: 공백을 무시한 근사 매칭 —
    // 추출 본문과 화면 표시가 줄바꿈·공백에서 어긋나는 경우를 흡수한다.
    function findApprox(txt, snippet) {
      if (txt.length > 2_000_000) return null; // 매핑 비용 상한
      const map = [];
      let squished = "";
      for (let i = 0; i < txt.length; i++) {
        const c = txt[i];
        if (c !== " " && c !== "\n" && c !== "\t" && c !== "\r") {
          map.push(i);
          squished += c;
        }
      }
      const n = snippet.replace(/\s+/g, "");
      if (n.length < 10) return null;
      const j = squished.indexOf(n.slice(0, 30));
      if (j < 0) return null;
      const endIdx = Math.min(j + Math.min(n.length, 160), map.length - 1);
      return { start: map[j], end: map[endIdx] + 1 };
    }
    function markRange(node, start, end) {
      try {
        const range = document.createRange();
        range.setStart(node, start);
        range.setEnd(node, Math.min(end, node.textContent.length));
        const mark = document.createElement("mark");
        mark.className = "hl";
        range.surroundContents(mark);
        mark.scrollIntoView({ block: "center" });
        return true;
      } catch (e) {
        return false;
      }
    }
    function applyHighlight(root, snippet) {
      const s = String(snippet || "").trim();
      if (s.length < 10) return;
      const tries = [60, 40, 25, 15];
      const nodes = [];
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      let node;
      while ((node = walker.nextNode())) {
        if ((node.textContent || "").length >= 15) nodes.push(node);
      }
      for (const nd of nodes) {  // 1차: 원문 매칭
        const txt = nd.textContent;
        for (const L of tries) {
          const needle = s.slice(0, L);
          if (needle.length < 10) break;
          const i = txt.indexOf(needle);
          if (i >= 0 && markRange(nd, i, i + Math.min(s.length, 200))) return;
        }
      }
      for (const nd of nodes) {  // 2차: 공백 무시 근사 매칭
        const r = findApprox(nd.textContent, s);
        if (r && markRange(nd, r.start, r.end)) return;
      }
    }

    function docxHtml(blocks) {
      if (!blocks || !blocks.length) return '<div class="msg"><p>내용이 없습니다.</p></div>';
      let html = '<div class="docx">';
      blocks.forEach((b) => {
        if (b.type === "space") { html += "<br>"; return; }
        const t = escapeHtml(b.text || "");
        if (b.type === "h1") html += "<h1>" + t + "</h1>";
        else if (b.type === "h2") html += "<h2>" + t + "</h2>";
        else if (b.type === "li") html += "<li>" + t + "</li>";
        else html += "<p>" + t + "</p>";
      });
      return html + "</div>";
    }

    function xlsxTableHtml(sheets) {
      if (!sheets || !sheets.length) return '<div class="msg"><p>표가 없습니다.</p></div>';
      let html = "";
      sheets.forEach((sh) => {
        html += '<div class="xls-name">' + escapeHtml(sh.name) + "</div><table class=\"xls\">";
        sh.rows.forEach((row, ri) => {
          html += "<tr>";
          row.forEach((c) => { const t = ri === 0 ? "th" : "td"; html += "<" + t + ">" + escapeHtml(c) + "</" + t + ">"; });
          html += "</tr>";
        });
        html += "</table>";
        if (sh.truncated) html += '<div class="xls-note">일부만 표시(최대 500행 × 40열)</div>';
      });
      return html;
    }

    async function render(info) {
      const content = $("content");
      if (!info || !info.path) {
        $("fname").textContent = "파일 없음";
        content.innerHTML = '<div class="msg"><div class="big">🚫</div><p>표시할 파일이 없습니다.</p></div>';
        return;
      }
      $("fname").textContent = info.name || "";
      $("fpath").textContent = info.path || "";
      const ext = info.ext || "";
      $("ficon").textContent = ext === ".pdf" ? "📕" : IMAGE.includes(ext) ? "🖼️" : "📄";

      if (!info.exists) {
        content.innerHTML = '<div class="msg"><div class="big">🚫</div><p>파일을 찾을 수 없습니다.<br>' + escapeHtml(info.path) + "</p></div>";
        return;
      }

      if (ext === ".pdf" && info.highlight) {
        // 근거 하이라이트: 1순위 pdf.js 렌더링 뷰(원본 레이아웃 위에 검색 하이라이트)
        // → 실패/스캔본이면 추출 텍스트 뷰 → 그것도 없으면 내장 뷰어.
        await showPdfRendered(info);
      } else if (ext === ".pdf" || HTML.includes(ext)) {
        content.innerHTML = ""; content.appendChild(safeFileEmbed("iframe", info));
      } else if (IMAGE.includes(ext)) {
        content.innerHTML = ""; content.appendChild(safeFileEmbed("img", info));
      } else if (TEXT.includes(ext)) {
        content.innerHTML = '<div class="msg"><p>불러오는 중…</p></div>';
        let r = { ok: false };
        try { r = await window.leva.readFile(info.path); } catch (e) {}
        if (r.ok) {
          const pre = document.createElement("pre");
          pre.textContent = r.text;
          content.innerHTML = ""; content.appendChild(pre);
          if (info.highlight) applyHighlight(content, info.highlight);
        } else {
          content.innerHTML = '<div class="msg"><div class="big">⚠️</div><p>' + escapeHtml(r.error || "읽기 실패") + "</p></div>";
        }
      } else if (ext === ".xlsx") {
        content.innerHTML = '<div class="msg"><p>표 불러오는 중…</p></div>';
        let r = { ok: false };
        try { r = await window.leva.readXlsx(info.path); } catch (e) {}
        content.innerHTML = r.ok ? xlsxTableHtml(r.sheets) : '<div class="msg"><div class="big">⚠️</div><p>' + escapeHtml(r.error || "읽기 실패") + "</p></div>";
      } else if (ext === ".docx") {
        content.innerHTML = '<div class="msg"><p>문서 불러오는 중…</p></div>';
        let r = { ok: false };
        try { r = await window.leva.readDocx(info.path); } catch (e) {}
        content.innerHTML = r.ok ? docxHtml(r.blocks) : '<div class="msg"><div class="big">⚠️</div><p>' + escapeHtml(r.error || "읽기 실패") + "</p></div>";
        if (r.ok && info.highlight) applyHighlight(content, info.highlight);
      } else {
        content.innerHTML = '<div class="msg"><div class="big">📎</div><p>이 형식은 미리보기를 지원하지 않습니다.<br>아래 “외부 앱으로 열기”를 눌러 주세요.</p></div>';
      }
    }

    // ---- PDF 근거 하이라이트 뷰 3종 ----------------------------------
    function pdfBar(label, actions) {
      // sticky — 하이라이트로 자동 스크롤돼도 전환 버튼이 항상 보이게
      const bar = document.createElement("div");
      bar.style.cssText = "position:sticky; top:0; z-index:5; background:var(--bg); padding:8px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px;";
      const span = document.createElement("span");
      span.style.cssText = "font-size:11.5px; color:var(--text-3); margin-right:auto;";
      span.textContent = label;
      bar.appendChild(span);
      actions.forEach(([text, fn]) => {
        const b = document.createElement("button");
        b.className = "btn"; b.textContent = text;
        b.addEventListener("click", fn);
        bar.appendChild(b);
      });
      return bar;
    }

    function showPdfEmbed(info) {
      const content = $("content");
      content.innerHTML = ""; content.appendChild(safeFileEmbed("iframe", info));
    }

    async function showPdfText(info) {
      // 추출 텍스트 뷰(스캔본은 저장된 OCR) — 텍스트 하이라이트
      const content = $("content");
      content.innerHTML = '<div class="msg"><p>근거 위치 찾는 중…</p></div>';
      let r = null;
      try { r = await window.leva.extractText(info.path); } catch (e) {}
      const body = (r && r.ok && r.text) || "";
      if (!body.trim()) { showPdfEmbed(info); return; }
      content.innerHTML = "";
      content.appendChild(pdfBar("추출 텍스트 보기 — 근거 대목을 하이라이트했습니다", [
        ["렌더링 뷰", () => showPdfRendered(info)],
        ["내장 뷰어", () => showPdfEmbed(info)],
      ]));
      const pre = document.createElement("pre");
      pre.textContent = body;
      content.appendChild(pre);
      applyHighlight(content, info.highlight);
    }

    async function showPdfRendered(info) {
      // pdf.js 컴포넌트로 원본 레이아웃을 렌더링하고, 텍스트 레이어 위에
      // 발췌 문구를 검색 하이라이트한다(스캔본은 텍스트 레이어가 없어 폴백).
      const content = $("content");
      content.innerHTML = '<div class="msg"><p>PDF 렌더링 중…</p></div>';
      try {
        const pdfjsLib = await import("./node_modules/pdfjs-dist/build/pdf.mjs");
        const V = await import("./node_modules/pdfjs-dist/web/pdf_viewer.mjs");
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          new URL("./node_modules/pdfjs-dist/build/pdf.worker.mjs", location.href).href;
        const r = await window.leva.readBin(info.path);
        if (!r || !r.ok) throw new Error((r && r.error) || "읽기 실패");
        content.innerHTML = "";
        content.appendChild(pdfBar("렌더링 뷰 — 근거 문구를 페이지 위에 하이라이트합니다", [
          ["텍스트로 보기", () => showPdfText(info)],
          ["내장 뷰어", () => showPdfEmbed(info)],
        ]));
        const wrap = document.createElement("div");
        wrap.style.cssText = "position:relative; height:calc(100% - 38px);";
        const container = document.createElement("div");
        container.style.cssText = "position:absolute; inset:0; overflow:auto; background:#0b0c0f;";
        const viewerDiv = document.createElement("div");
        viewerDiv.className = "pdfViewer";
        container.appendChild(viewerDiv);
        wrap.appendChild(container);
        content.appendChild(wrap);

        const eventBus = new V.EventBus();
        const linkService = new V.PDFLinkService({ eventBus });
        const findController = new V.PDFFindController({ eventBus, linkService });
        const viewer = new V.PDFViewer({
          container, viewer: viewerDiv, eventBus, linkService, findController,
        });
        linkService.setViewer(viewer);
        let found = false;
        eventBus.on("updatefindmatchescount", (ev) => {
          if (ev && ev.matchesCount && ev.matchesCount.total > 0) found = true;
        });
        eventBus.on("pagesinit", () => {
          viewer.currentScaleValue = "page-width";
          // 발췌 앞부분(공백 정규화, 단어 경계에서 자름)으로 검색
          let q = String(info.highlight || "").replace(/\s+/g, " ").trim().slice(0, 40);
          const sp = q.lastIndexOf(" ");
          if (sp > 15) q = q.slice(0, sp);
          if (q.length >= 6) {
            eventBus.dispatch("find", {
              source: null, type: "", query: q, caseSensitive: false,
              entireWord: false, highlightAll: true, findPrevious: false,
            });
            // 텍스트 레이어가 없거나(스캔본) 못 찾으면 텍스트 뷰로 폴백
            setTimeout(() => { if (!found) showPdfText(info); }, 2500);
          }
        });
        const doc = await pdfjsLib.getDocument({ data: r.data }).promise;
        viewer.setDocument(doc);
        linkService.setDocument(doc, null);
      } catch (e) {
        // pdf.js 미설치/로드 실패 → 추출 텍스트 뷰로 폴백
        showPdfText(info);
      }
    }

    $("external").addEventListener("click", async () => {
      const info = await window.leva.getViewerFile();
      if (info && info.path) window.leva.openExternalFile(info.path);
    });
    $("close").addEventListener("click", () => window.close());
    window.addEventListener("keydown", (e) => { if (e.key === "Escape") window.close(); });

    // 다른 파일로 갱신될 때
    if (window.leva.onViewerFile) window.leva.onViewerFile((info) => render(info));

    (async () => {
      let info = null;
      try { info = await window.leva.getViewerFile(); } catch (e) {}
      render(info);
    })();
  </script>
</body>
</html>
