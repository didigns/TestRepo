<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LevA HUD</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Segoe UI", "맑은 고딕", sans-serif;
  }

  #stage {
    position: absolute;
    right: 0; bottom: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
    padding: 20px;
    pointer-events: none;
  }

  #bubbles {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
    width: 100%;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .bubble {
    max-width: 90%;
    max-height: 60vh;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.5;
    color: #fff;
    white-space: pre-wrap;
    word-break: break-word;
    pointer-events: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,0.28);
    backdrop-filter: blur(10px);
    animation: rise 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    transform-origin: bottom right;
  }
  .bubble::-webkit-scrollbar { width: 7px; }
  .bubble::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.35); border-radius: 6px; }
  .filelink {
    color: #eaf1ff; text-decoration: underline; text-underline-offset: 2px;
    cursor: pointer; font-weight: 600; padding: 0 2px; border-radius: 4px;
  }
  .filelink:hover { background: rgba(255,255,255,0.22); }
  .bubble.ai {
    background: linear-gradient(135deg, rgba(41, 121, 255, 0.92), rgba(124, 77, 255, 0.92));
    border-bottom-right-radius: 6px;
  }
  .bubble.user {
    background: linear-gradient(135deg, rgba(60, 64, 72, 0.92), rgba(38, 41, 47, 0.92));
    border-bottom-right-radius: 6px;
    align-self: flex-end;
  }
  .bubble.typing { color: #dfe6ff; font-style: italic; opacity: 0.85; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(18px) scale(0.92); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .bubble.fade {
    opacity: 0;
    transform: translateY(10px) scale(0.96);
    transition: opacity .35s ease, transform .35s ease;
  }

  #inputWrap {
    display: none;
    align-items: center;
    gap: 8px;
    width: 100%;
    margin-bottom: 16px;
    pointer-events: auto;
  }
  #inputWrap.show { display: flex; }
  #prompt {
    flex: 1;
    padding: 12px 16px;
    border: none;
    border-radius: 22px;
    background: rgba(30, 32, 38, 0.92);
    color: #fff;
    font-size: 14px;
    outline: none;
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  }
  #prompt::placeholder { color: #98a0ad; }
  #sendBtn {
    width: 44px; height: 44px;
    border: none; border-radius: 50%;
    background: linear-gradient(135deg, #2979ff, #7c4dff);
    color: #fff; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 20px rgba(41,121,255,0.5);
  }

  #orbRow {
    display: flex; align-items: center; gap: 10px;
    pointer-events: auto;
  }
  #closeBtn {
    width: 26px; height: 26px; border-radius: 50%;
    border: none; cursor: pointer;
    background: rgba(30,32,38,0.7); color: #cfd6e2;
    font-size: 14px; opacity: 0; transition: opacity .2s;
  }
  #orbRow:hover #closeBtn { opacity: 1; }

  .orb-wrap { position: relative; width: 96px; height: 96px; -webkit-app-region: no-drag; }
  .pulse {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle, rgba(124,77,255,0.5), transparent 70%);
    animation: pulse 2.6s ease-out infinite;
  }
  .pulse.d { animation-delay: 1.3s; }
  @keyframes pulse {
    0%   { transform: scale(0.85); opacity: 0.7; }
    100% { transform: scale(1.7); opacity: 0; }
  }
  #orb {
    position: absolute; inset: 8px;
    border-radius: 50%; cursor: pointer;
    background: radial-gradient(circle at 32% 30%, #8ab6ff, #2979ff 40%, #7c4dff 85%);
    box-shadow: 0 10px 30px rgba(41,121,255,0.55), inset 0 -6px 16px rgba(0,0,0,0.3), inset 0 6px 14px rgba(255,255,255,0.35);
    display: flex; align-items: center; justify-content: center;
    animation: float 4s ease-in-out infinite;
    transition: transform .18s;
  }
  #orb:hover { transform: scale(1.06); }
  #orb:active { transform: scale(0.96); }
  #orb.thinking { animation: float 4s ease-in-out infinite, spin 1.1s linear infinite; }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  @keyframes spin { to { filter: hue-rotate(360deg); } }
  .core {
    width: 34px; height: 34px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #ffffff, #d9e6ff 60%, #a9c6ff);
    box-shadow: 0 0 18px rgba(255,255,255,0.9);
    animation: breathe 2.2s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(0.72); opacity: 0.7; }
  }

  /* 우클릭 컨텍스트 메뉴 (윈도우 스타일) */
  #menu {
    position: absolute;
    display: none;
    min-width: 180px;
    padding: 6px;
    background: rgba(43, 43, 46, 0.98);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 10px;
    box-shadow: 0 12px 34px rgba(0,0,0,0.45);
    backdrop-filter: blur(14px);
    pointer-events: auto;
    z-index: 999;
    animation: menuIn 0.12s ease-out;
  }
  #menu.show { display: block; }
  @keyframes menuIn {
    from { opacity: 0; transform: translateY(6px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .menu-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px;
    border-radius: 7px;
    font-size: 13.5px;
    color: #f0f0f2;
    cursor: pointer;
  }
  .menu-item:hover { background: rgba(255,255,255,0.10); }
  .menu-item .ico { width: 16px; text-align: center; opacity: 0.85; }
  .menu-sep { height: 1px; margin: 5px 8px; background: rgba(255,255,255,0.10); }
  .menu-item.danger { color: #ff9b9b; }
</style>
</head>
<body>
  <div id="stage">
    <div id="bubbles"></div>

    <div id="inputWrap">
      <input id="prompt" type="text" placeholder="무엇이든 물어보세요…" autocomplete="off" />
      <button id="sendBtn" title="보내기">➤</button>
    </div>

    <div id="orbRow">
      <button id="closeBtn" title="종료">✕</button>
      <div class="orb-wrap" id="orbWrap">
        <div class="pulse"></div>
        <div class="pulse d"></div>
        <div id="orb" title="클릭해서 대화 / 우클릭으로 메뉴"><div class="core"></div></div>
      </div>
    </div>
  </div>

  <!-- 우클릭 컨텍스트 메뉴 -->
  <div id="menu">
    <div class="menu-item" data-action="chat"><span class="ico">💬</span>대화 열기</div>
    <div class="menu-item" data-action="dashboard"><span class="ico">📊</span>대시보드</div>
    <div class="menu-item" data-action="settings"><span class="ico">⚙️</span>설정</div>
    <div class="menu-sep"></div>
    <div class="menu-item danger" data-action="quit"><span class="ico">⏻</span>종료</div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
