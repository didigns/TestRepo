<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>LevA 설정</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 22px;
    font-family: "Segoe UI", "맑은 고딕", sans-serif;
    background: #1e2024; color: #e9ecf1;
  }
  h1 { font-size: 17px; margin: 0 0 2px; }
  p.sub { margin: 0 0 14px; font-size: 12.5px; color: #98a0ad; }
  h2 {
    font-size: 13px; color: #9fb4ff; margin: 22px 0 8px;
    padding-bottom: 6px; border-bottom: 1px solid #2c313a;
    display: flex; align-items: center; gap: 7px;
  }
  label.field { display: block; font-size: 12.5px; margin: 12px 0 5px; color: #c7cedb; }
  input[type="text"] {
    width: 100%; padding: 9px 12px;
    border: 1px solid #3a3f47; border-radius: 8px;
    background: #14161a; color: #fff; font-size: 13px; outline: none;
  }
  input[type="text"]:focus { border-color: #2979ff; }
  .hint { font-size: 11px; color: #7e8794; margin-top: 4px; }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 14px; font-size: 13px; color: #c7cedb;
  }
  .switch { position: relative; width: 44px; height: 24px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; cursor: pointer; background: #3a3f47; border-radius: 24px; transition: .2s; }
  .slider::before { content: ""; position: absolute; height: 18px; width: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  input:checked + .slider { background: #2979ff; }
  input:checked + .slider::before { transform: translateX(20px); }

  .status { font-size: 11.5px; padding: 4px 8px; border-radius: 6px; }
  .status.on { background: rgba(60,200,120,0.15); color: #6ee7a8; }
  .status.off { background: rgba(255,120,120,0.15); color: #ff9b9b; }
  #folderList, #cacheList { margin-top: 10px; display: flex; flex-direction: column; gap: 7px; }
  .folder, .citem {
    display: flex; align-items: center; gap: 8px;
    background: #14161a; border: 1px solid #2c313a; border-radius: 8px;
    padding: 8px 10px; font-size: 12px;
  }
  .folder .p, .citem .c { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #dfe4ec; }
  .citem .kw { font-size: 10.5px; color: #9fb4ff; }
  .folder .tag { font-size: 10px; color: #8fa4ff; background: rgba(41,121,255,0.15); padding: 2px 6px; border-radius: 5px; flex: none; }
  .folder .rm { border: none; background: #2b2f36; color: #ff9b9b; border-radius: 6px; padding: 4px 8px; cursor: pointer; flex: none; }
  .empty { font-size: 12px; color: #7e8794; padding: 8px 2px; }
  .addbar { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .addbar button, .btn { background: linear-gradient(135deg,#2979ff,#7c4dff); color:#fff; border:none; border-radius:8px; padding:9px 12px; cursor:pointer; font-size:12.5px; }
  .addbar .rec { display:flex; align-items:center; gap:5px; font-size:12px; color:#c7cedb; }
  .pathrow { display: flex; gap: 6px; }
  .pathrow input { flex: 1; }
  .pathrow button { background: #2b2f36; color: #cfd6e2; border: none; border-radius: 8px; padding: 0 12px; cursor: pointer; font-size: 12px; flex: none; }

  .actions { display: flex; gap: 10px; margin-top: 24px; }
  button.main { flex: 1; padding: 11px; border: none; border-radius: 8px; font-size: 13.5px; cursor: pointer; }
  #save { background: linear-gradient(135deg, #2979ff, #7c4dff); color: #fff; }
  #cancel { background: #2b2f36; color: #cfd6e2; }
  #status { font-size: 12px; color: #6ee7a8; height: 16px; margin-top: 10px; text-align: center; }
</style>
</head>
<body>
  <h1>LevA 설정</h1>
  <p class="sub">AI 비서 · 폴더 감시 · 파일 캐싱을 설정합니다.</p>

  <h2>🤖 온디바이스 LLM (대화)</h2>
  <label class="field" for="model">모델 이름</label>
  <input id="model" type="text" placeholder="llama3.2" />
  <div class="hint">대화용 Ollama 모델명 (예: llama3.2, qwen2.5)</div>
  <label class="field" for="endpoint">Ollama 엔드포인트</label>
  <input id="endpoint" type="text" placeholder="http://127.0.0.1:11434" />
  <div class="row">
    <span>항상 위에 표시</span>
    <label class="switch"><input id="alwaysOnTop" type="checkbox" /><span class="slider"></span></label>
  </div>

  <h2>📁 폴더 관리 <span id="obsStatus" class="status off">확인 중…</span></h2>
  <div class="row">
    <span>파일 변경을 말풍선으로 알림</span>
    <label class="switch"><input id="notifyOnEvents" type="checkbox" /><span class="slider"></span></label>
  </div>
  <div id="folderList"><div class="empty">불러오는 중…</div></div>
  <div class="addbar">
    <label class="rec"><input id="recursive" type="checkbox" /> 하위폴더 포함</label>
    <button id="addFolder">+ 폴더 추가</button>
  </div>
  <label class="field" for="ignore">무시할 패턴 (쉼표로 구분)</label>
  <input id="ignore" type="text" placeholder="*.tmp, ~$*, *.log" />

  <h2>🧠 AI 캐싱 (llama.cpp) <span id="cacheStatus" class="status off">확인 중…</span></h2>
  <div class="row">
    <span>파일 추가/수정 시 자동 캐싱</span>
    <label class="switch"><input id="enableCache" type="checkbox" /><span class="slider"></span></label>
  </div>
  <div class="hint">pdf·이미지 → MiniCPM-V, 그 외 문서 → Gemma 로 키워드·요약을 미리 캐싱합니다.</div>

  <label class="field">llama-server.exe 경로</label>
  <div class="pathrow"><input id="llamaServerExe" type="text" placeholder="C:\\Work\\llamaCpp\\llama-server.exe" /><button data-pick="llamaServerExe" data-kind="exe">찾기</button></div>

  <label class="field">Gemma 모델 (gguf) — 그 외 파일</label>
  <div class="pathrow"><input id="textModel" type="text" placeholder="gemma-4b.gguf" /><button data-pick="textModel" data-kind="gguf">찾기</button></div>

  <label class="field">MiniCPM-V 모델 (gguf) — pdf/이미지</label>
  <div class="pathrow"><input id="visionModel" type="text" placeholder="minicpm-v.gguf" /><button data-pick="visionModel" data-kind="gguf">찾기</button></div>

  <label class="field">MiniCPM-V mmproj (gguf)</label>
  <div class="pathrow"><input id="visionMmproj" type="text" placeholder="mmproj-minicpm-v.gguf" /><button data-pick="visionMmproj" data-kind="gguf">찾기</button></div>

  <div class="addbar">
    <button id="rescan" class="btn">감시 폴더 다시 스캔</button>
  </div>
  <label class="field">최근 캐시</label>
  <div id="cacheList"><div class="empty">불러오는 중…</div></div>

  <div class="actions">
    <button id="cancel" class="main">닫기</button>
    <button id="save" class="main">저장</button>
  </div>
  <div id="status"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const ids = ["model","endpoint","alwaysOnTop","notifyOnEvents","ignore",
                 "enableCache","llamaServerExe","textModel","visionModel","visionMmproj"];
    const el = {}; ids.forEach((i) => el[i] = $(i));
    const statusEl = $("status"), obsStatusEl = $("obsStatus"), cacheStatusEl = $("cacheStatus");
    const listEl = $("folderList"), cacheListEl = $("cacheList"), recEl = $("recursive");

    async function loadBasic() {
      const cfg = await window.leva.getSettings();
      el.model.value = cfg.model || "";
      el.endpoint.value = cfg.endpoint || "";
      el.alwaysOnTop.checked = !!cfg.alwaysOnTop;
      el.notifyOnEvents.checked = cfg.notifyOnEvents !== false;
      el.ignore.value = (cfg.ignorePatterns || []).join(", ");
      el.enableCache.checked = cfg.enableCache !== false;
      el.llamaServerExe.value = cfg.llamaServerExe || "";
      el.textModel.value = cfg.textModel || "";
      el.visionModel.value = cfg.visionModel || "";
      el.visionMmproj.value = cfg.visionMmproj || "";
    }

    function setStatus(node, running, err) {
      if (running) { node.textContent = "실행 중"; node.className = "status on"; }
      else { node.textContent = err ? "오류" : "중지됨"; node.className = "status off"; node.title = err || ""; }
      return running;
    }

    async function refreshFolders() {
      const s = await window.leva.observerStatus();
      const running = setStatus(obsStatusEl, s.running, s.error);
      if (!running) { listEl.innerHTML = '<div class="empty">감시 데몬 미실행. Python 경로 확인.</div>'; return; }
      let watches = [];
      try { watches = await window.leva.observerList(); } catch (e) {}
      if (!watches.length) { listEl.innerHTML = '<div class="empty">감시 중인 폴더가 없습니다.</div>'; return; }
      listEl.innerHTML = "";
      watches.forEach((w) => {
        const div = document.createElement("div"); div.className = "folder";
        const p = document.createElement("span"); p.className = "p"; p.textContent = w.path; p.title = w.path;
        div.appendChild(p);
        if (w.recursive) { const t = document.createElement("span"); t.className = "tag"; t.textContent = "하위포함"; div.appendChild(t); }
        const rm = document.createElement("button"); rm.className = "rm"; rm.textContent = "삭제";
        rm.onclick = async () => { rm.disabled = true; await window.leva.observerRemove(w.watchId, w.path); refreshFolders(); };
        div.appendChild(rm); listEl.appendChild(div);
      });
    }

    async function refreshCache() {
      const s = await window.leva.cacheStatus();
      const running = setStatus(cacheStatusEl, s.running, s.error);
      if (!running) { cacheListEl.innerHTML = '<div class="empty">캐시 워커 미실행. Python/모델 경로 확인.</div>'; return; }
      let entries = [];
      try { entries = await window.leva.cacheList(); } catch (e) {}
      if (!entries.length) { cacheListEl.innerHTML = '<div class="empty">캐시된 파일이 없습니다.</div>'; return; }
      cacheListEl.innerHTML = "";
      entries.slice(0, 30).forEach((it) => {
        const div = document.createElement("div"); div.className = "citem";
        const box = document.createElement("div"); box.className = "c";
        const nm = document.createElement("div"); nm.textContent = (it.status === "CACHED" ? "✓ " : it.status === "FAILED" ? "✕ " : "… ") + it.filename;
        const kw = document.createElement("div"); kw.className = "kw"; kw.textContent = (it.keywords || []).join(", ");
        box.appendChild(nm); box.appendChild(kw); div.appendChild(box); cacheListEl.appendChild(div);
      });
    }

    // 경로 찾기 버튼
    document.querySelectorAll("button[data-pick]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const picked = await window.leva.pickFile(btn.dataset.kind);
        if (picked) el[btn.dataset.pick].value = picked;
      });
    });

    $("addFolder").addEventListener("click", async () => {
      const folder = await window.leva.pickFolder();
      if (!folder) return;
      const r = await window.leva.observerAdd(folder, recEl.checked);
      statusEl.style.color = (r && r.ok === false) ? "#ff9b9b" : "#6ee7a8";
      statusEl.textContent = (r && r.ok === false) ? (r.message || "추가 실패") : "폴더가 추가되었습니다 ✓";
      setTimeout(() => (statusEl.textContent = ""), 2500);
      refreshFolders();
    });

    $("rescan").addEventListener("click", async () => {
      statusEl.style.color = "#9fb4ff"; statusEl.textContent = "스캔 요청됨…";
      try { await window.leva.cacheRescan(); statusEl.textContent = "스캔 완료 ✓"; }
      catch (e) { statusEl.style.color = "#ff9b9b"; statusEl.textContent = "스캔 실패"; }
      setTimeout(() => (statusEl.textContent = ""), 2500);
      refreshCache();
    });

    $("save").addEventListener("click", async () => {
      const patterns = el.ignore.value.split(",").map((s) => s.trim()).filter(Boolean);
      await window.leva.saveSettings({
        model: el.model.value.trim() || "llama3.2",
        endpoint: el.endpoint.value.trim() || "http://127.0.0.1:11434",
        alwaysOnTop: el.alwaysOnTop.checked,
        notifyOnEvents: el.notifyOnEvents.checked,
        enableCache: el.enableCache.checked,
        llamaServerExe: el.llamaServerExe.value.trim(),
        textModel: el.textModel.value.trim(),
        visionModel: el.visionModel.value.trim(),
        visionMmproj: el.visionMmproj.value.trim(),
      });
      try { await window.leva.observerSetIgnore(patterns); } catch (e) {}
      statusEl.style.color = "#6ee7a8"; statusEl.textContent = "저장되었습니다 ✓ (모델 경로 변경 시 재시작 권장)";
      setTimeout(() => (statusEl.textContent = ""), 2600);
    });

    $("cancel").addEventListener("click", () => window.leva.closeSettings());
    window.addEventListener("keydown", (e) => { if (e.key === "Escape") window.leva.closeSettings(); });

    loadBasic();
    refreshFolders();
    refreshCache();
    setInterval(() => { refreshFolders(); refreshCache(); }, 5000);
  </script>
</body>
</html>
